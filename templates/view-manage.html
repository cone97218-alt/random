<!-- Random Macro Extension - Manage View -->
<div class="random-manage-wrap">

    <!-- Toolbar -->
    <div class="random-toolbar">
        <button class="random-btn random-btn--primary" id="random-add-group-btn" title="新建宏配置组">
            <i class="fa-solid fa-plus"></i>
        </button>
        <div class="random-toolbar-spacer"></div>
        <button class="random-btn random-btn--secondary" id="random-reroll-all-btn" title="重新随机所有启用的宏组">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </div>

    <!-- Group List -->
    <div class="random-group-list" id="random-group-list">
        <!-- Groups rendered here by JS -->
        <div class="random-empty-hint" id="random-groups-empty">
            <i class="fa-solid fa-dice fa-2x"></i>
            <span>还没有宏配置组，点击「新建宏组」开始</span>
        </div>
    </div>

</div>

<!-- ── Group Edit Modal ── -->
<div class="random-modal-overlay" id="random-group-modal" style="display:none;">
    <div class="random-modal">
        <div class="random-modal-header">
            <span id="random-group-modal-title">新建宏配置组</span>
            <button class="random-icon-btn" id="random-group-modal-close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="random-modal-body">

            <!-- ── Group Basic & Injection Settings Collapsible ── -->
            <details class="random-gm-details">
                <summary class="random-gm-summary">
                    <i class="fa-solid fa-sliders"></i>
                    <span>基础与注入配置</span>
                </summary>
                <div class="random-gm-details-body">
                    <!-- Group name -->
                    <div class="random-field">
                        <label class="random-field-label">组名称</label>
                        <input type="text" class="random-input" id="random-gm-name" placeholder="例如：天气系统" />
                    </div>

                    <!-- Scope & Enabled -->
                    <div class="random-field-row" style="display:flex; gap:12px; align-items:flex-end;">
                        <div class="random-field" style="flex:1;">
                            <label class="random-field-label">作用范围</label>
                            <select class="random-select" id="random-gm-scope">
                                <option value="global">全局</option>
                                <option value="character">当前角色卡</option>
                            </select>
                        </div>
                        <div class="random-field random-field--inline" style="padding-bottom:6px;">
                            <label class="random-field-label">启用</label>
                            <label class="random-toggle">
                                <input type="checkbox" id="random-gm-enabled" checked />
                                <span class="random-toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <!-- Injection Role -->
                    <div class="random-field">
                        <label class="random-field-label">注入身份</label>
                        <select class="random-select" id="random-gm-role">
                            <option value="0">System</option>
                            <option value="1">User</option>
                            <option value="2">Assistant</option>
                        </select>
                    </div>

                    <!-- Injection Depth & Order -->
                    <div class="random-field-row" style="display:flex; gap:12px;">
                        <div class="random-field" style="flex:1;">
                            <label class="random-field-label">注入深度</label>
                            <input type="number" class="random-input random-input--narrow" id="random-gm-depth"
                                min="0" step="1" value="4" />
                            <span class="random-field-hint">从末尾往前数，0=末尾</span>
                        </div>
                        <div class="random-field" style="flex:1;">
                            <label class="random-field-label">注入顺序</label>
                            <input type="number" class="random-input random-input--narrow" id="random-gm-order"
                                min="0" step="1" value="0" placeholder="0" />
                            <span class="random-field-hint">数字越小越靠前</span>
                        </div>
                    </div>

                    <!-- Lifecycle override -->
                    <div class="random-field random-field--inline">
                        <label class="random-field-label">使用全局周期设置</label>
                        <label class="random-toggle">
                            <input type="checkbox" id="random-gm-lifecycle-global" checked />
                            <span class="random-toggle-slider"></span>
                        </label>
                    </div>

                    <div id="random-gm-lifecycle-custom" style="display:none;">
                        <div class="random-field-row" style="display:flex; gap:12px;">
                            <div class="random-field" style="flex:1;">
                                <label class="random-field-label">每 x 轮注入一次</label>
                                <input type="number" class="random-input random-input--narrow" id="random-gm-every-x"
                                    min="1" step="1" placeholder="留空=每轮" />
                            </div>
                            <div class="random-field" style="flex:1;">
                                <label class="random-field-label">注入后保持 y 轮</label>
                                <input type="number" class="random-input random-input--narrow" id="random-gm-keep-y"
                                    min="0" step="1" placeholder="留空=不保持" />
                            </div>
                        </div>
                    </div>
                </div>
            </details>

            <!-- Template -->
            <div class="random-field">
                <label class="random-field-label">
                    注入内容模板
                    <span class="random-field-hint">用 &#123;&#123;random_宏ID&#125;&#125; 嵌入宏</span>
                </label>
                <textarea class="random-textarea" id="random-gm-template" rows="4"
                    placeholder="今天的天气是&#123;&#123;random_天气&#125;&#125;，气温&#123;&#123;random_温度&#125;&#125;度。"></textarea>
            </div>

            <!-- Macros list within this group -->
            <div class="random-field">
                <div class="random-field-label-row">
                    <label class="random-field-label">宏列表</label>
                    <div class="random-field-actions">
                        <button class="random-btn random-btn--sm" id="random-gm-batch-toggle-btn" title="批量多选与删除">
                            <i class="fa-solid fa-list-check"></i>
                        </button>
                        <button class="random-btn random-btn--sm" id="random-gm-search-toggle-btn" title="搜索定位宏及依赖">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                        <button class="random-btn random-btn--sm" id="random-gm-scan-btn" title="从上方模板文本中扫描 &#123;&#123;random_xxx&#125;&#125; 并自动补齐宏">
                            <i class="fa-solid fa-satellite-dish"></i>
                        </button>
                        <button class="random-btn random-btn--sm" id="random-gm-add-macro-btn" title="添加宏">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
                <!-- Search bar in group modal -->
                <div class="random-gm-search-bar" id="random-gm-search-bar" style="display:none;">
                    <div class="random-gm-search-input-wrap">
                        <i class="fa-solid fa-magnifying-glass random-gm-search-icon"></i>
                        <input type="text" class="random-input random-gm-search-input" id="random-gm-search-input"
                            placeholder="输入关键词定位宏名称、选项内容或依赖链..." />
                        <button class="random-icon-btn--xs random-gm-search-clear" id="random-gm-search-clear" title="清空搜索" style="display:none;">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="random-gm-search-stats" id="random-gm-search-stats" style="display:none;"></div>
                </div>
                <!-- Batch operations toolbar (hidden by default, shown when clicking batch button) -->
                <div class="random-gm-batch-bar" id="random-gm-batch-bar" style="display:none;">
                    <label class="random-gm-batch-select-label" title="全选 / 取消全选">
                        <input type="checkbox" id="random-gm-select-all" class="random-checkbox" />
                        <span id="random-gm-select-count">0 / 0 已选</span>
                    </label>
                    <div class="random-gm-batch-actions">
                        <button class="random-btn random-btn--sm" id="random-gm-select-range-btn" title="开启连选模式：依次点击起点与终点宏即可连选区间">
                            <i class="fa-solid fa-link"></i>
                            <span>连选</span>
                        </button>
                        <button class="random-btn random-btn--sm" id="random-gm-select-invert-btn" title="反选当前列表项">
                            <i class="fa-solid fa-arrows-rotate"></i>
                            <span>反选</span>
                        </button>
                        <button class="random-btn random-btn--sm random-btn--danger" id="random-gm-batch-del-btn" style="display:none;" title="批量移除选中的宏">
                            <i class="fa-solid fa-trash"></i>
                            <span id="random-gm-batch-del-text">批量删除</span>
                        </button>
                    </div>
                </div>
                <!-- Health check alert bar -->
                <div class="random-gm-health-bar" id="random-gm-health-bar" style="display:none;"></div>
                <div class="random-macro-list" id="random-gm-macro-list">
                    <!-- Macros rendered here -->
                </div>
            </div>

        </div>
        <div class="random-modal-footer">
            <button class="random-btn random-btn--ghost" id="random-group-modal-cancel">
                <i class="fa-solid fa-ban"></i>
                <span>取消</span>
            </button>
            <button class="random-btn random-btn--primary" id="random-group-modal-save">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>保存</span>
            </button>
        </div>
    </div>
</div>

<!-- ── Macro Edit Modal ── -->
<div class="random-modal-overlay" id="random-macro-modal" style="display:none;">
    <div class="random-modal">
        <div class="random-modal-header">
            <span id="random-macro-modal-title">编辑宏</span>
            <button class="random-icon-btn" id="random-macro-modal-close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="random-modal-body">

            <!-- Macro ID -->
            <div class="random-field">
                <label class="random-field-label">
                    宏 ID
                    <span class="random-field-hint">在模板中用 &#123;&#123;random_这里&#125;&#125; 调用</span>
                </label>
                <input type="text" class="random-input" id="random-mm-id"
                    placeholder="例如：天气" pattern="[a-zA-Z0-9\u4e00-\u9fff_-]+" />
            </div>

            <!-- Trigger Probability -->
            <div class="random-field">
                <label class="random-field-label">触发概率 (%)</label>
                <input type="number" class="random-input random-input--narrow" id="random-mm-prob"
                    min="0" max="100" step="1" value="100" />
                <span class="random-field-hint">0=从不 100=始终</span>
            </div>

            <!-- Options -->
            <div class="random-field">
                <div class="random-field-label-row">
                    <label class="random-field-label">选项列表</label>
                    <div class="random-field-label-actions">
                        <button class="random-btn random-btn--sm random-btn--ghost" id="random-mm-toggle-tag-btn" type="button" title="显示或隐藏标签列">
                            <i class="fa-solid fa-tags"></i>
                            <span id="random-mm-toggle-tag-text">标签</span>
                        </button>
                        <button class="random-btn random-btn--sm" id="random-mm-add-option-btn" type="button">
                            <i class="fa-solid fa-plus"></i>
                            <span>添加选项</span>
                        </button>
                    </div>
                </div>
                <div class="random-option-list" id="random-mm-option-list">
                    <!-- Options rendered here -->
                </div>
            </div>

        </div>
        <div class="random-modal-footer">
            <button class="random-btn random-btn--ghost" id="random-macro-modal-cancel">
                <i class="fa-solid fa-ban"></i>
                <span>取消</span>
            </button>
            <button class="random-btn random-btn--primary" id="random-macro-modal-save">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>保存宏</span>
            </button>
        </div>
    </div>
</div>
