<!-- Random Macro Extension - AI Generate View -->
<div class="random-generate-wrap">

    <!-- ── Top Collapsible: 目标配置与已有宏组注入 ── -->
    <details class="random-gen-collapsible" id="random-gen-top-details" open>
        <summary class="random-gen-collapsible-summary">
            <div class="random-gen-collapsible-title">
                <i class="fa-solid fa-layer-group" style="color:var(--random-accent);"></i>
                <span id="random-gen-summary-text">目标宏组与注入上下文</span>
                <span class="random-gen-summary-badge" id="random-gen-summary-badge" style="display:none;"></span>
            </div>
            <div class="random-gen-summary-action">
                <i class="fa-solid fa-chevron-down random-gen-chevron"></i>
            </div>
        </summary>
        <div class="random-gen-collapsible-body">
            <!-- Target group selector -->
            <div class="random-generate-header">
                <div class="random-field random-field--inline random-field--grow">
                    <label class="random-field-label">目标宏组</label>
                    <select class="random-select random-select--grow" id="random-gen-group-select">
                        <option value="">— 选择宏配置组 —</option>
                    </select>
                </div>
                <div class="random-field random-field--inline">
                    <label class="random-field-label">目标宏</label>
                    <select class="random-select" id="random-gen-macro-select">
                        <option value="__all__">全部宏</option>
                    </select>
                </div>
            </div>

            <!-- Injected Macro Group Context Card / Slot -->
            <div class="random-gen-slot-bar" id="random-gen-slot-bar">
                <div class="random-gen-slot-header">
                    <div class="random-gen-slot-title">
                        <i class="fa-solid fa-boxes-stacked" style="color:var(--random-accent);"></i>
                        <span>注入已有宏组上下文</span>
                        <span class="random-gen-injected-count" id="random-gen-injected-count" style="display:none;"></span>
                    </div>
                    <div class="random-gen-slot-controls">
                        <select class="random-select random-select--sm" id="random-gen-inject-group-select">
                            <option value="">+ 追加注入宏组到提示词...</option>
                        </select>
                        <button class="random-btn random-btn--xs random-btn--secondary" id="random-gen-inject-curr-btn" type="button" title="追加注入上方已选的目标宏组">
                            <i class="fa-solid fa-plus"></i>
                            <span>注入当前组</span>
                        </button>
                        <button class="random-btn random-btn--xs" id="random-gen-injected-clear-all-btn" type="button" style="display:none;" title="清空全部已注入的宏组">
                            <i class="fa-solid fa-trash"></i>
                            <span>清空</span>
                        </button>
                    </div>
                </div>

                <!-- Injected Groups List (Multi-group chips container) -->
                <div class="random-gen-injected-list" id="random-gen-injected-list" style="display:none;">
                    <!-- Injected group chips rendered here -->
                </div>
            </div>
        </div>
    </details>

    <!-- Chat area -->
    <div class="random-generate-chat" id="random-gen-chat">
        <div class="random-gen-hint" id="random-gen-hint">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>选择或注入一个或多个已有宏组后，点击下方「合并/整理/扩充/嵌套」等功能卡槽，让 AI 智能整理</span>
        </div>
    </div>

    <!-- AI result preview & edit -->
    <div class="random-generate-result" id="random-gen-result" style="display:none;">
        <div class="random-generate-result-header">
            <span class="random-generate-result-label">
                <i class="fa-solid fa-list-check"></i>
                <span id="random-gen-result-title">AI 生成/整理/合并结果（可编辑）</span>
            </span>
            <button class="random-btn random-btn--sm" id="random-gen-clear-result-btn" title="清空结果">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>

        <!-- Structured Group Overview (when full group returned) -->
        <div class="random-gen-structured-preview" id="random-gen-structured-preview" style="display:none;">
            <div class="random-gen-structured-header">
                <span class="random-gen-structured-title" id="random-gen-structured-name"></span>
                <span class="random-inspect-meta-pill" id="random-gen-structured-count"></span>
            </div>
            <div class="random-gen-structured-template" id="random-gen-structured-template"></div>
        </div>

        <div class="random-option-edit-list" id="random-gen-option-edit-list">
            <!-- Editable option rows rendered here -->
        </div>
        <div class="random-generate-result-footer">
            <button class="random-btn random-btn--sm random-btn--secondary" id="random-gen-add-option-btn">
                <i class="fa-solid fa-plus"></i>
                <span>添加一行</span>
            </button>
            <div class="random-toolbar-spacer"></div>
            <button class="random-btn random-btn--sm random-btn--secondary" id="random-gen-apply-update-btn" style="display:none;" title="直接用整理后的内容更新原宏组">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>更新原宏组</span>
            </button>
            <button class="random-btn random-btn--primary" id="random-gen-import-btn">
                <i class="fa-solid fa-file-import"></i>
                <span>确认导入</span>
            </button>
        </div>
    </div>

    <!-- ── Prompt Functional Slots Bar (Collapsible) ── -->
    <details class="random-gen-chips-details" id="random-gen-chips-details" open>
        <summary class="random-gen-chips-summary">
            <div class="random-gen-chips-summary-title">
                <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--random-accent);"></i>
                <span>提示词功能卡槽</span>
            </div>
            <i class="fa-solid fa-chevron-down random-gen-chevron"></i>
        </summary>
        <div class="random-gen-chips-bar">
            <div class="random-gen-chips-scroll">
                <button class="random-gen-chip-btn" data-slot="merge" type="button" title="将注入的多个宏组深度合并重组成一个统一连贯的宏组与模板">
                    <i class="fa-solid fa-code-merge"></i>
                    <span>合并多个宏组</span>
                </button>
                <button class="random-gen-chip-btn" data-slot="clean" type="button" title="去除重复项、修正错别字并规范格式">
                    <i class="fa-solid fa-broom"></i>
                    <span>整理与去重</span>
                </button>
                <button class="random-gen-chip-btn" data-slot="expand" type="button" title="扩充15-20个更丰富生动的高质量选项">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <span>扩充新选项</span>
                </button>
                <button class="random-gen-chip-btn" data-slot="split_nested" type="button" title="拆分公共维度为结构化二级嵌套宏 {{random_xxx}}">
                    <i class="fa-solid fa-sitemap"></i>
                    <span>拆分嵌套宏</span>
                </button>
                <button class="random-gen-chip-btn" data-slot="weight_tag" type="button" title="智能标注标签并设定抽取权重">
                    <i class="fa-solid fa-scale-balanced"></i>
                    <span>权重与标签</span>
                </button>
                <button class="random-gen-chip-btn" data-slot="polish" type="button" title="文学修辞深度润色与情绪张力强化">
                    <i class="fa-solid fa-feather"></i>
                    <span>深度文学润色</span>
                </button>
            </div>
        </div>
    </details>

    <!-- Input area -->
    <div class="random-generate-input-area">
        <textarea class="random-textarea random-gen-textarea" id="random-gen-input"
            placeholder="输入具体需求，或点击上方功能卡槽让 AI 智能整理/扩充..." rows="2"></textarea>
        <div class="random-generate-actions">
            <button class="random-gen-send-btn" id="random-gen-send-btn" title="发送 (Ctrl+Enter)">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
            <button class="random-gen-abort-btn" id="random-gen-abort-btn" style="display:none;" title="停止">
                <i class="fa-solid fa-stop"></i>
            </button>
        </div>
    </div>

</div>
